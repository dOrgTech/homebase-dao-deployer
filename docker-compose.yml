version: "3"

services:
  homebase-dao-deployer:
    # image: manjain/homebase-dao-deployer:httpsprod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./cert.pem:/app/cert.pem
      - ./chain.pem:/app/chain.pem
      - ./privkey.pem:/app/privkey.pem
    env_file:
      - .env
